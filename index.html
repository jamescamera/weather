<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12100E">
<title>Today's Weather, Painted</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --gallery:#12100E;
    --paper:#EDE9E0;
    --ink:#1A1A18;
    --ink-soft:#5C574E;
    --rule:#C9C2B4;
    --label-w: 340px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--gallery);
    color:var(--paper);
    font-family:"IBM Plex Mono",ui-monospace,monospace;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }

  #stage{position:fixed;inset:0;overflow:hidden;background:var(--gallery)}
  .plate{
    position:absolute;inset:0;
    background-size:cover;background-position:center;
    opacity:0;transition:opacity 1.6s ease;
    will-change:transform,opacity;
    animation:drift 68s ease-in-out infinite alternate;
  }
  .plate.on{opacity:1}
  @keyframes drift{
    from{transform:scale(1.06) translate3d(-1.2%,-0.8%,0)}
    to{transform:scale(1.14) translate3d(1.2%,1%,0)}
  }
  #stage.bare::after{
    content:"";position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);
    width:min(52vw,300px);aspect-ratio:4/3;
    background:radial-gradient(120% 120% at 50% 30%, rgba(237,233,224,.09), transparent 70%);
    border:1px solid rgba(237,233,224,.14);
  }
  #veil{
    position:fixed;inset:0;pointer-events:none;
    background:
      radial-gradient(120% 80% at 50% 30%, transparent 40%, rgba(8,7,6,.45) 100%),
      linear-gradient(to top, rgba(8,7,6,.88) 0%, rgba(8,7,6,.5) 26%, transparent 58%);
  }

  #label{
    position:fixed;left:0;right:0;bottom:0;
    padding:24px 22px calc(24px + env(safe-area-inset-bottom));
    display:flex;flex-direction:column;gap:14px;
    cursor:pointer;
  }
  .eyebrow{
    font-size:10px;letter-spacing:.22em;text-transform:uppercase;
    color:rgba(237,233,224,.62);
  }
  .artist{
    font-size:11px;letter-spacing:.2em;text-transform:uppercase;
    color:rgba(237,233,224,.8);
  }
  .title{
    font-family:"Instrument Serif",Georgia,serif;font-style:italic;
    font-size:clamp(30px,8vw,52px);line-height:1.02;letter-spacing:-.01em;
    text-wrap:balance;
  }
  .medium{font-size:12px;color:rgba(237,233,224,.62)}

  .accession{
    display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 14px;
    padding-top:14px;border-top:1px solid rgba(237,233,224,.22);
    font-size:12px;letter-spacing:.06em;
  }
  .accession .temp{
    font-family:"Instrument Serif",Georgia,serif;font-style:normal;
    font-size:30px;letter-spacing:0;line-height:1;
  }
  .accession .cond{color:rgba(237,233,224,.86);text-transform:lowercase}
  .accession .place{color:rgba(237,233,224,.55);margin-left:auto;text-align:right}

  #entry{
    position:fixed;inset:0;background:var(--paper);color:var(--ink);
    padding:calc(28px + env(safe-area-inset-top)) 24px calc(28px + env(safe-area-inset-bottom));
    display:flex;flex-direction:column;gap:22px;
    transform:translateY(101%);transition:transform .5s cubic-bezier(.16,.84,.44,1);
    overflow-y:auto;cursor:pointer;
  }
  #entry.open{transform:translateY(0)}
  #entry .eyebrow{color:var(--ink-soft)}
  #entry h2{
    font-family:"Instrument Serif",Georgia,serif;font-weight:400;font-style:italic;
    font-size:clamp(26px,7vw,40px);line-height:1.05;
  }
  .rows{display:flex;flex-direction:column}
  .row{
    display:flex;justify-content:space-between;align-items:baseline;gap:16px;
    padding:11px 0;border-bottom:1px solid var(--rule);font-size:13px;
  }
  .row dt{color:var(--ink-soft);letter-spacing:.14em;text-transform:uppercase;font-size:10px}
  .row dd{text-align:right}
  .why{
    font-family:"Instrument Serif",Georgia,serif;font-size:19px;line-height:1.45;
    color:var(--ink);max-width:44ch;
  }
  .foot{margin-top:auto;padding-top:20px;font-size:10px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--ink-soft);display:flex;justify-content:space-between;gap:12px}
  .foot button, .foot a{
    font:inherit;letter-spacing:.16em;text-transform:uppercase;
    background:none;border:none;border-bottom:1px solid var(--ink);
    color:var(--ink);padding:0 0 2px;cursor:pointer;text-decoration:none;
  }

  #status{
    position:fixed;inset:0;display:grid;place-items:center;text-align:center;
    padding:32px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;
    color:rgba(237,233,224,.7);background:var(--gallery);z-index:5;
    transition:opacity .6s ease;
  }
  #status.gone{opacity:0;pointer-events:none}
  #status .beat{font-family:"Instrument Serif",serif;font-style:italic;
    font-size:26px;letter-spacing:0;text-transform:none;color:var(--paper)}
  #status button{
    font:inherit;letter-spacing:.16em;text-transform:uppercase;margin-top:16px;
    background:none;border:1px solid rgba(237,233,224,.4);color:var(--paper);
    padding:11px 18px;cursor:pointer;
  }

  /* ---- audit view (?audit) ---- */
  #audit{position:fixed;inset:0;background:var(--paper);color:var(--ink);
    overflow-y:auto;padding:24px 18px 60px;display:none;z-index:9}
  #audit.on{display:block}
  #audit h1{font-family:"Instrument Serif",serif;font-style:italic;font-weight:400;
    font-size:30px;margin-bottom:6px}
  #audit .sum{font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--ink-soft);margin-bottom:20px}
  .aud{display:flex;gap:14px;padding:12px 0;border-bottom:1px solid var(--rule);align-items:flex-start}
  .aud img{width:88px;height:66px;object-fit:cover;background:#ddd8cc;flex:none}
  .aud .no{width:88px;height:66px;background:#ddd8cc;flex:none}
  .aud .m{font-size:12px;line-height:1.5;min-width:0;word-break:break-word}
  .aud .n{font-family:"Instrument Serif",serif;font-style:italic;font-size:17px}
  .aud .tag{font-size:10px;letter-spacing:.14em;text-transform:uppercase}
  .pass .tag{color:#2C6E49}
  .fail .tag{color:#A3341F}
  .aud .dim{color:var(--ink-soft)}

  :focus-visible{outline:2px solid #EDE9E0;outline-offset:3px}

  @media (min-width:760px){
    #label{left:auto;right:0;width:var(--label-w);bottom:0;top:0;
      justify-content:flex-end;background:linear-gradient(to left,rgba(8,7,6,.9),transparent);
      padding:40px 36px calc(40px + env(safe-area-inset-bottom))}
    .accession .place{margin-left:0;text-align:left;width:100%}
    #entry{left:auto;width:var(--label-w);transform:translateX(101%)}
    #entry.open{transform:translateX(0)}
  }
  @media (prefers-reduced-motion:reduce){
    .plate{animation:none}
    #entry{transition:none}
  }
</style>
</head>
<body>

<div id="stage"></div>
<div id="veil"></div>

<div id="label" hidden>
  <div class="eyebrow" id="l-eyebrow">On view today</div>
  <div>
    <div class="artist" id="l-artist"></div>
    <div class="title" id="l-title"></div>
    <div class="medium" id="l-medium"></div>
  </div>
  <div class="accession">
    <span class="temp" id="l-temp"></span>
    <span class="cond" id="l-cond"></span>
    <span class="place" id="l-place"></span>
  </div>
</div>

<div id="entry">
  <div class="eyebrow">Catalogue entry</div>
  <h2 id="e-title"></h2>
  <dl class="rows" id="e-rows"></dl>
  <p class="why" id="e-why"></p>
  <div class="foot">
    <span>Open-Meteo · Wikimedia</span>
    <button id="e-next" type="button">Rehang</button>
  </div>
</div>

<div id="status">
  <div>
    <div class="beat" id="s-beat">Reading the sky…</div>
    <div id="s-sub" style="margin-top:10px"></div>
    <div id="s-act"></div>
  </div>
</div>

<div id="audit">
  <h1>Collection audit</h1>
  <div class="sum" id="a-sum">Checking every work…</div>
  <div id="a-list"></div>
</div>

<script>
/* ==================================================================
   THE COLLECTION
   `wiki` — first Wikipedia article title to try.
   `alts` — further titles to try if the first misses (article names move).
   A resolved page must pass looksRight(): its title has to genuinely
   match the work. No page is accepted on description alone.
   Buckets: clear partly overcast fog drizzle rain downpour snow storm
   Optional: day:true|false   temp:"warm"|"cold"
   Visit ?audit to see which entries resolve and which are broken.
==================================================================== */

const NEIGHBOURS = {
  clear:["partly"], partly:["clear","overcast"], overcast:["partly","fog"],
  fog:["overcast"], drizzle:["rain","overcast"], rain:["drizzle","downpour"],
  downpour:["rain","storm"], storm:["downpour"], snow:[]
};

const CODES = {
  0:["clear","clear sky"],
  1:["clear","mainly clear"], 2:["partly","partly cloudy"], 3:["overcast","overcast"],
  45:["fog","fog"], 48:["fog","freezing fog"],
  51:["drizzle","light drizzle"], 53:["drizzle","drizzle"], 55:["drizzle","heavy drizzle"],
  56:["drizzle","freezing drizzle"], 57:["drizzle","freezing drizzle"],
  61:["rain","light rain"], 63:["rain","rain"], 65:["downpour","heavy rain"],
  66:["rain","freezing rain"], 67:["downpour","freezing rain"],
  71:["snow","light snow"], 73:["snow","snow"], 75:["snow","heavy snow"], 77:["snow","snow grains"],
  80:["rain","rain showers"], 81:["rain","rain showers"], 82:["downpour","violent showers"],
  85:["snow","snow showers"], 86:["snow","heavy snow showers"],
  95:["storm","thunderstorm"], 96:["storm","thunderstorm with hail"], 99:["storm","thunderstorm with hail"]
};
const FALLBACK = { lat:51.5074, lon:-0.1278, name:"London" };

const $ = s => document.querySelector(s);
const stage = $("#stage"), statusEl = $("#status");
let state = null, shown = [];

function setStatus(beat, sub, action){
  statusEl.classList.remove("gone");
  $("#s-beat").textContent = beat;
  $("#s-sub").textContent = sub || "";
  $("#s-act").innerHTML = "";
  if(action){
    const b = document.createElement("button");
    b.type = "button"; b.textContent = action.label;
    b.addEventListener("click", action.fn);
    $("#s-act").appendChild(b);
  }
}

/* ------------------------- location / weather ------------------------- */
function locate(){
  return new Promise(resolve => {
    if(!navigator.geolocation) return resolve(FALLBACK);
    navigator.geolocation.getCurrentPosition(
      p => resolve({ lat:p.coords.latitude, lon:p.coords.longitude, name:null }),
      () => resolve(FALLBACK),
      { timeout:8000, maximumAge:600000 }
    );
  });
}

async function placeName(lat, lon){
  try{
    const r = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=en`);
    if(!r.ok) throw 0;
    const j = await r.json();
    return j.locality || j.city || j.principalSubdivision || null;
  }catch{ return null; }
}

async function getWeather(lat, lon){
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}`
    + `&current=temperature_2m,apparent_temperature,is_day,weather_code,wind_speed_10m,relative_humidity_2m`
    + `&daily=temperature_2m_max,temperature_2m_min&timezone=auto`;
  const r = await fetch(url);
  if(!r.ok) throw new Error("weather");
  return r.json();
}

/* ---------------------- image lookup + validation ---------------------- */
const STOP = new Set(["the","a","an","of","at","on","in","over","and","with","from","de","la","le","to","her","his"]);
const words = s => (s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")
  .replace(/[^a-z0-9\s]/g," ").split(/\s+/).filter(w => w && !STOP.has(w));

/* The page must actually BE this work. Title overlap is REQUIRED — a page
   merely described as "a painting by Monet" is not good enough, which is
   what let Water Lilies onto the wall. */
function looksRight(pageTitle, description, work){
  const want = words(work.title);
  if(!want.length) return false;
  const got = new Set(words(pageTitle));
  const overlap = want.filter(w => got.has(w)).length / want.length;
  if(overlap < 0.6) return false;

  const d = (description || "").toLowerCase();
  const person = /\b(painter|artist|printmaker|sculptor|photographer|engraver)\b/.test(d)
                 && !/\b(painting|print|artwork|series)\b/.test(d);
  return !person;
}

const upscale = u => u ? u.replace(/\/\d+px-/, "/1600px-") : null;

/* Returns { src, page, why } — `why` explains a rejection, for ?audit */
async function resolveImage(work){
  const titles = [work.wiki, ...(work.alts || [])];
  let lastWhy = "no article found";

  for(const t of titles){
    try{
      const r = await fetch("https://en.wikipedia.org/api/rest_v1/page/summary/" + encodeURIComponent(t));
      if(!r.ok){ lastWhy = `no article "${t}"`; continue; }
      const j = await r.json();
      const src = upscale(j.thumbnail && j.thumbnail.source) || (j.originalimage && j.originalimage.source);
      if(!src){ lastWhy = `"${j.title}" has no image`; continue; }
      if(!looksRight(j.title, j.description, work)){ lastWhy = `resolved to "${j.title}" — rejected`; continue; }
      return { src, page:j.title, why:null };
    }catch{ lastWhy = "network error"; }
  }

  /* search, same guard applied */
  try{
    const q = encodeURIComponent(`${work.title} ${work.artist} painting`);
    const r = await fetch("https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*"
      + `&generator=search&gsrsearch=${q}&gsrlimit=6`
      + "&prop=pageimages|description&piprop=thumbnail&pithumbsize=1600");
    if(r.ok){
      const j = await r.json();
      const pages = (j.query && j.query.pages) ? Object.values(j.query.pages) : [];
      for(const p of pages){
        const src = p.thumbnail && p.thumbnail.source;
        if(src && looksRight(p.title, p.description, work)) return { src, page:p.title, why:null };
      }
      if(pages.length) lastWhy += ` · search offered "${pages[0].title}"`;
    }
  }catch{}

  return { src:null, page:null, why:lastWhy };
}

const preload = src => new Promise((res, rej) => {
  const i = new Image();
  i.onload = () => (i.naturalWidth > 400 ? res(src) : rej(new Error("too small")));
  i.onerror = () => rej(new Error("load failed"));
  i.src = src;
});

/* ------------------------------ curation ------------------------------ */
const shuffle = a => a.map(v => [Math.random(), v]).sort((x,y) => x[0]-y[0]).map(p => p[1]);
const tempBand = c => c >= 22 ? "warm" : c <= 4 ? "cold" : "mild";

function candidates(bucket, isDay, band){
  const inBucket = b => COLLECTION.filter(w => w.buckets.includes(b));
  const lightOK  = w => w.day === undefined || w.day === isDay;
  const tempOK   = w => w.temp === undefined || w.temp === band;

  const tiers = [];
  const own = inBucket(bucket);
  tiers.push(own.filter(w => lightOK(w) && tempOK(w)));
  tiers.push(own.filter(lightOK));
  for(const n of (NEIGHBOURS[bucket] || [])){
    tiers.push(inBucket(n).filter(w => lightOK(w) && tempOK(w)));
    tiers.push(inBucket(n).filter(lightOK));
  }

  const seen = new Set(), out = [];
  for(const tier of tiers) for(const w of shuffle(tier)){
    if(!seen.has(w.wiki)){ seen.add(w.wiki); out.push(w); }
  }
  return [...out.filter(w => !shown.includes(w.wiki)), ...out.filter(w => shown.includes(w.wiki))];
}

/* ------------------------------- render ------------------------------- */
function writeLabel(work){
  const w = state.w.current, d = state.w.daily;
  $("#l-eyebrow").textContent = w.is_day ? "On view today" : "On view tonight";
  $("#l-artist").textContent = work ? work.artist : "";
  $("#l-title").textContent  = work ? work.title  : "No work on view";
  $("#l-medium").textContent = work ? `${work.medium}, ${work.year}` : "The wall is bare today";
  $("#l-temp").textContent   = Math.round(w.temperature_2m) + "°";
  $("#l-cond").textContent   = state.label;
  $("#l-place").textContent  = state.place || "";
  $("#label").hidden = false;

  $("#e-title").textContent = work ? work.title : "No work on view";
  $("#e-why").textContent = work ? work.why
    : "Nothing in the collection could be verified for these conditions. The weather below is still current.";
  $("#e-rows").innerHTML = [
    work && ["Artist", work.artist],
    work && ["Painted", work.year],
    work && ["Medium", work.medium],
    ["Conditions", state.label],
    ["Temperature", Math.round(w.temperature_2m) + "°C"],
    ["Feels like", Math.round(w.apparent_temperature) + "°C"],
    ["Today's range", `${Math.round(d.temperature_2m_min[0])}° – ${Math.round(d.temperature_2m_max[0])}°`],
    ["Wind", Math.round(w.wind_speed_10m) + " km/h"],
    ["Humidity", w.relative_humidity_2m + "%"],
    ["Location", state.place || `${state.lat.toFixed(2)}, ${state.lon.toFixed(2)}`]
  ].filter(Boolean).map(([k,v]) => `<div class="row"><dt>${k}</dt><dd>${v}</dd></div>`).join("");

  statusEl.classList.add("gone");
}

function showPlate(src){
  stage.classList.remove("bare");
  const plate = document.createElement("div");
  plate.className = "plate";
  plate.style.backgroundImage = `url("${src}")`;
  stage.appendChild(plate);
  requestAnimationFrame(() => plate.classList.add("on"));
  setTimeout(() => { while(stage.children.length > 1) stage.removeChild(stage.firstChild); }, 1800);
}

async function rehang(){
  const isDay = !!state.w.current.is_day;
  for(const work of candidates(state.bucket, isDay, state.band)){
    try{
      const { src } = await resolveImage(work);
      if(!src) continue;
      await preload(src);
      showPlate(src);
      shown.push(work.wiki);
      if(shown.length > 6) shown.shift();
      writeLabel(work);
      return;
    }catch{ /* next candidate in the bucket */ }
  }
  while(stage.firstChild) stage.removeChild(stage.firstChild);
  stage.classList.add("bare");
  writeLabel(null);
}

async function start(){
  setStatus("Reading the sky…");
  const loc = await locate();
  try{
    const [w, place] = await Promise.all([
      getWeather(loc.lat, loc.lon),
      loc.name ? Promise.resolve(loc.name) : placeName(loc.lat, loc.lon)
    ]);
    const [bucket, label] = CODES[w.current.weather_code] || ["overcast","cloud"];
    state = { w, lat:loc.lat, lon:loc.lon, place, bucket, label,
              band: tempBand(w.current.temperature_2m), at: Date.now() };
    setStatus("Hanging the work…");
    await rehang();
  }catch{
    setStatus("No forecast.", "Couldn't reach the weather service.",
      { label:"Try again", fn:start });
  }
}

/* -------------------------------- audit -------------------------------- */
async function runAudit(){
  $("#audit").classList.add("on");
  statusEl.classList.add("gone");
  const list = $("#a-list");
  let pass = 0;

  for(const work of COLLECTION){
    const { src, page, why } = await resolveImage(work);
    if(src) pass++;
    const row = document.createElement("div");
    row.className = "aud " + (src ? "pass" : "fail");
    row.innerHTML = `
      ${src ? `<img src="${src}" alt="">` : `<div class="no"></div>`}
      <div class="m">
        <div class="n">${work.title}</div>
        <div class="dim">${work.artist} · ${work.buckets.join(", ")}</div>
        <div class="tag">${src ? "resolved → " + page : "failed — " + why}</div>
      </div>`;
    list.appendChild(row);
    $("#a-sum").textContent = `${pass} of ${COLLECTION.length} resolved`;
  }
  $("#a-sum").textContent = `${pass} of ${COLLECTION.length} resolved — check each thumbnail is the painting, not a portrait or a gallery shot`;
}

/* ---------------------------- interaction ----------------------------- */
const entry = $("#entry");
$("#label").addEventListener("click", () => entry.classList.add("open"));
entry.addEventListener("click", e => { if(e.target.id !== "e-next") entry.classList.remove("open"); });
$("#e-next").addEventListener("click", e => { e.stopPropagation(); entry.classList.remove("open"); rehang(); });
document.addEventListener("keydown", e => {
  if(e.key === "Escape") entry.classList.remove("open");
  if(e.key === "r" && state) rehang();
});
document.addEventListener("visibilitychange", () => {
  if(!document.hidden && state && Date.now() - state.at > 900000) start();
});

if(location.search.includes("audit")) runAudit(); else start();
</script>
